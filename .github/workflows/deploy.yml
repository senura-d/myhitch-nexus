name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs between the in-flight one and the
# newest are dropped rather than piling up.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Verify & build
    runs-on: ubuntu-latest
    env:
      # Pages serves this repo from /<repo>. Set once here so the build, the
      # static server used by the tests, and Playwright's baseURL all agree —
      # if they drift, every asset 404s and navigations hang.
      NEXT_PUBLIC_BASE_PATH: /myhitch-nexus
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx next lint --max-warnings 0

      - name: Setup Pages
        # Only needed for the actual deployment, and it fails on PRs from forks.
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build static export
        run: npx next build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests against the export
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Add .nojekyll
        # Stops GitHub Pages running the output through Jekyll, which would
        # drop Next's _next/ directory.
        run: touch ./out/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
