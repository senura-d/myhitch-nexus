<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_live_helio_keynote" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="glow_live_helio_keynote" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="pat_live_helio_keynote" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.07" />
    </pattern>
    <linearGradient id="scrim_live_helio_keynote" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="960" height="540" fill="url(#grad_live_helio_keynote)" />
  <rect width="960" height="540" fill="url(#pat_live_helio_keynote)" />

  <!-- Ambient light blobs -->
  <circle cx="200" cy="150" r="280" fill="#082f49" filter="blur(80px)" opacity="0.6" />
  <circle cx="760" cy="380" r="320" fill="#0e7490" filter="blur(90px)" opacity="0.5" />

  <!-- Visual Central Graphic -->
  
      <g transform="translate(480, 220)">
        <ellipse cx="0" cy="80" rx="220" ry="24" fill="#000" opacity="0.5" />
        <path d="M-180 50 C -120 50 -100 10 -40 0 C 20 -10 100 0 160 30 C 190 45 200 55 200 65 L -180 65 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <path d="M-70 5 C -30 -15 40 -15 80 5 C 60 25 10 30 -60 25 Z" fill="#0284c7" opacity="0.7" />
        <circle cx="-110" cy="65" r="28" fill="#1e293b" stroke="#0ea5e9" stroke-width="4" />
        <circle cx="120" cy="65" r="28" fill="#1e293b" stroke="#0ea5e9" stroke-width="4" />
        <path d="M160 40 L 320 20 L 320 80 L 160 55 Z" fill="url(#glow_live_helio_keynote)" opacity="0.4" />
        <path d="M-300 -120 Q 0 -60 300 -140" fill="none" stroke="#22d3ee" stroke-width="18" filter="blur(20px)" opacity="0.4" />
      </g>
    

  <!-- Dark gradient scrim for legibility -->
  <rect width="960" height="540" fill="url(#scrim_live_helio_keynote)" />

  <!-- Header Badge -->
  
  <g transform="translate(48, 48)">
    <rect width="136" height="28" rx="6" fill="#000000" opacity="0.75" />
    <text x="14" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">LIVE KEYNOTE</text>
  </g>
  

  <!-- Bottom title & description metadata -->
  <g transform="translate(48, 440)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">Helio Autumn Keynote</text>
    
    <text x="0" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">Leipzig Global Premiere &amp; Q&amp;A</text>
    
  </g>
</svg>