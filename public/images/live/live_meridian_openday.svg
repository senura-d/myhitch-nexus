<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_live_meridian_openday" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <radialGradient id="glow_live_meridian_openday" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="pat_live_meridian_openday" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.07" />
    </pattern>
    <linearGradient id="scrim_live_meridian_openday" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="960" height="540" fill="url(#grad_live_meridian_openday)" />
  <rect width="960" height="540" fill="url(#pat_live_meridian_openday)" />

  <!-- Ambient light blobs -->
  <circle cx="200" cy="150" r="280" fill="#172554" filter="blur(80px)" opacity="0.6" />
  <circle cx="760" cy="380" r="320" fill="#1d4ed8" filter="blur(90px)" opacity="0.5" />

  <!-- Visual Central Graphic -->
  
      <g transform="translate(480, 220)">
        <path d="M-220 80 Q -100 80 -40 -60 Q 0 -140 40 -60 Q 100 80 220 80" fill="none" stroke="#10b981" stroke-width="5" />
        <path d="M-220 80 Q -100 80 -40 -60 Q 0 -140 40 -60 Q 100 80 220 80 L220 90 L-220 90 Z" fill="#10b981" opacity="0.15" />
        <line x1="0" y1="-140" x2="0" y2="90" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4" />
        <circle cx="0" cy="-140" r="8" fill="#fbbf24" />
        <text x="-15" y="-155" fill="#fef08a" font-size="18" font-family="sans-serif" font-weight="bold">μ</text>
        <rect x="-180" y="-120" width="90" height="50" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
        <text x="-165" y="-90" fill="#a7f3d0" font-size="14" font-family="monospace">p &lt; 0.001</text>
      </g>
    

  <!-- Dark gradient scrim for legibility -->
  <rect width="960" height="540" fill="url(#scrim_live_meridian_openday)" />

  <!-- Header Badge -->
  
  <g transform="translate(48, 48)">
    <rect width="100" height="28" rx="6" fill="#000000" opacity="0.75" />
    <text x="14" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">OPEN DAY</text>
  </g>
  

  <!-- Bottom title & description metadata -->
  <g transform="translate(48, 440)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">Open Day: Admissions Q&amp;A</text>
    
    <text x="0" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">Meridian University Faculty Stream</text>
    
  </g>
</svg>