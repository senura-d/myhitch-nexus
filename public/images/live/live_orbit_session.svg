<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_live_orbit_session" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e" />
      <stop offset="50%" stop-color="#86198f" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <radialGradient id="glow_live_orbit_session" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="pat_live_orbit_session" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.07" />
    </pattern>
    <linearGradient id="scrim_live_orbit_session" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="960" height="540" fill="url(#grad_live_orbit_session)" />
  <rect width="960" height="540" fill="url(#pat_live_orbit_session)" />

  <!-- Ambient light blobs -->
  <circle cx="200" cy="150" r="280" fill="#4a044e" filter="blur(80px)" opacity="0.6" />
  <circle cx="760" cy="380" r="320" fill="#86198f" filter="blur(90px)" opacity="0.5" />

  <!-- Visual Central Graphic -->
  
      <g transform="translate(480, 200)">
        <rect x="-35" y="-100" width="70" height="120" rx="35" fill="#334155" stroke="#ec4899" stroke-width="3" />
        <line x1="-20" y1="-70" x2="20" y2="-70" stroke="#94a3b8" stroke-width="3" />
        <line x1="-25" y1="-40" x2="25" y2="-40" stroke="#94a3b8" stroke-width="3" />
        <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#94a3b8" stroke-width="3" />
        <line x1="0" y1="20" x2="0" y2="120" stroke="#64748b" stroke-width="8" />
        <circle cx="-120" cy="0" r="50" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.5" />
        <circle cx="120" cy="0" r="50" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.5" />
        <circle cx="-160" cy="0" r="80" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.3" />
        <circle cx="160" cy="0" r="80" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3" />
      </g>
    

  <!-- Dark gradient scrim for legibility -->
  <rect width="960" height="540" fill="url(#scrim_live_orbit_session)" />

  <!-- Header Badge -->
  
  <g transform="translate(48, 48)">
    <rect width="136" height="28" rx="6" fill="#000000" opacity="0.75" />
    <text x="14" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">LIVE CONCERT</text>
  </g>
  

  <!-- Bottom title & description metadata -->
  <g transform="translate(48, 440)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">Orbit Session 15 — Room Session</text>
    
    <text x="0" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">Orbit Sessions · Exclusive Member Stream</text>
    
  </g>
</svg>