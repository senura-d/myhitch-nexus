<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_live_northlight_premiere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <radialGradient id="glow_live_northlight_premiere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="pat_live_northlight_premiere" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.07" />
    </pattern>
    <linearGradient id="scrim_live_northlight_premiere" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="960" height="540" fill="url(#grad_live_northlight_premiere)" />
  <rect width="960" height="540" fill="url(#pat_live_northlight_premiere)" />

  <!-- Ambient light blobs -->
  <circle cx="200" cy="150" r="280" fill="#022c22" filter="blur(80px)" opacity="0.6" />
  <circle cx="760" cy="380" r="320" fill="#065f46" filter="blur(90px)" opacity="0.5" />

  <!-- Visual Central Graphic -->
  
      <g transform="translate(480, 160)" opacity="0.9">
        <path d="M-60 220 L60 220 L40 60 L-40 60 Z" fill="#1e293b" />
        <path d="M-35 60 L35 60 L25 -10 L-25 -10 Z" fill="#f8fafc" />
        <rect x="-30" y="80" width="60" height="20" fill="#dc2626" />
        <rect x="-35" y="140" width="70" height="20" fill="#dc2626" />
        <circle cx="0" cy="-25" r="28" fill="#fef08a" opacity="0.9" />
        <polygon points="0,-25 -420,-120 -400,160" fill="url(#glow_live_northlight_premiere)" opacity="0.35" />
        <polygon points="0,-25 420,-90 440,190" fill="url(#glow_live_northlight_premiere)" opacity="0.35" />
        <path d="M-200 240 Q -100 200 0 240 T 200 240 T 400 240" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.4" />
      </g>
    

  <!-- Dark gradient scrim for legibility -->
  <rect width="960" height="540" fill="url(#scrim_live_northlight_premiere)" />

  <!-- Header Badge -->
  
  <g transform="translate(48, 48)">
    <rect width="100" height="28" rx="6" fill="#000000" opacity="0.75" />
    <text x="14" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PREMIERE</text>
  </g>
  

  <!-- Bottom title & description metadata -->
  <g transform="translate(48, 440)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">Glasshouse — World Premiere</text>
    
    <text x="0" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">Ticketed Premiere followed by Cast Q&amp;A</text>
    
  </g>
</svg>