<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_live_tideline_appeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <radialGradient id="glow_live_tideline_appeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="pat_live_tideline_appeal" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.07" />
    </pattern>
    <linearGradient id="scrim_live_tideline_appeal" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="960" height="540" fill="url(#grad_live_tideline_appeal)" />
  <rect width="960" height="540" fill="url(#pat_live_tideline_appeal)" />

  <!-- Ambient light blobs -->
  <circle cx="200" cy="150" r="280" fill="#042f2e" filter="blur(80px)" opacity="0.6" />
  <circle cx="760" cy="380" r="320" fill="#0f766e" filter="blur(90px)" opacity="0.5" />

  <!-- Visual Central Graphic -->
  
      <g transform="translate(480, 200)">
        <circle cx="0" cy="0" r="110" fill="#0f766e" opacity="0.3" />
        <path d="M-180 80 Q -80 -40 0 40 T 180 20 L180 120 L-180 120 Z" fill="#115e59" />
        <path d="M-100 80 Q 0 -60 100 80 Z" fill="#047857" opacity="0.8" />
        <circle cx="100" cy="-40" r="28" fill="#f59e0b" />
        <path d="M-160 -60 Q -80 -80 0 -60 Q 80 -40 160 -60" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
      </g>
    

  <!-- Dark gradient scrim for legibility -->
  <rect width="960" height="540" fill="url(#scrim_live_tideline_appeal)" />

  <!-- Header Badge -->
  
  <g transform="translate(48, 48)">
    <rect width="118" height="28" rx="6" fill="#000000" opacity="0.75" />
    <text x="14" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">LIVE FIELD</text>
  </g>
  

  <!-- Bottom title & description metadata -->
  <g transform="translate(48, 440)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">Restoration Day Live</text>
    
    <text x="0" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">Six Hours Live from the Blackwater</text>
    
  </g>
</svg>