<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_live_ledger_briefing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="glow_live_ledger_briefing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="pat_live_ledger_briefing" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.07" />
    </pattern>
    <linearGradient id="scrim_live_ledger_briefing" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="960" height="540" fill="url(#grad_live_ledger_briefing)" />
  <rect width="960" height="540" fill="url(#pat_live_ledger_briefing)" />

  <!-- Ambient light blobs -->
  <circle cx="200" cy="150" r="280" fill="#082f49" filter="blur(80px)" opacity="0.6" />
  <circle cx="760" cy="380" r="320" fill="#0c4a6e" filter="blur(90px)" opacity="0.5" />

  <!-- Visual Central Graphic -->
  
      <g transform="translate(480, 200)">
        <circle cx="0" cy="0" r="100" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="8,8" />
        <circle cx="0" cy="0" r="60" fill="none" stroke="#f87171" stroke-width="2" />
        <circle cx="0" cy="0" r="12" fill="#ef4444" />
        <line x1="-160" y1="-80" x2="160" y2="80" stroke="#38bdf8" stroke-width="2" />
        <line x1="-140" y1="80" x2="140" y2="-80" stroke="#38bdf8" stroke-width="2" />
        <rect x="-120" y="70" width="240" height="40" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
        <text x="0" y="95" fill="#f1f5f9" font-size="14" font-family="monospace" text-anchor="middle" letter-spacing="2">CLASSIFIED REPORT</text>
      </g>
    

  <!-- Dark gradient scrim for legibility -->
  <rect width="960" height="540" fill="url(#scrim_live_ledger_briefing)" />

  <!-- Header Badge -->
  
  <g transform="translate(48, 48)">
    <rect width="100" height="28" rx="6" fill="#000000" opacity="0.75" />
    <text x="14" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">BRIEFING</text>
  </g>
  

  <!-- Bottom title & description metadata -->
  <g transform="translate(48, 440)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5">Newsroom Briefing</text>
    
    <text x="0" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">The Water Investigation Post-Mortem</text>
    
  </g>
</svg>